services:
  db:
    image: postgres:16-alpine
    container_name: desafio_backend_postgres
    restart: always
    environment:
      POSTGRES_DB: desafiodb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5433:5432"
    volumes:
      - postgres_desafio_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d desafiodb"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: desafio_backend_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/DesafioBackend.Api/Dockerfile
    container_name: desafio_backend_api
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=desafiodb;Username=postgres;Password=postgrespassword
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
      - Storage__BasePath=/app/uploads/cnh
      - Jwt__Key=development-only-change-this-key-before-production-123456
    ports:
      - "5000:8080"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: src/DesafioBackend.Web/Dockerfile
    container_name: desafio_backend_web
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - Api__BaseUrl=http://api:8080/
      - Api__AuthPath=auth/login
    ports:
      - "5001:8080"
    depends_on:
      - api

volumes:
  postgres_desafio_data:
